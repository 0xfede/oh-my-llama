# Watch upstream ollama/ollama for new releases and rebase this fork onto them.
#
# The fork is a rebase-onto-tags soft fork: the fork branch is always
# <upstream tag> + our patch commits. When upstream ships vX.Y.Z this job rebases
# those commits onto the new tag and pushes an omll-v* tag, which triggers
# oh-my-llama-release.yaml.
#
# If a patch stops applying, the job stops and opens an issue rather than pushing
# a half-merged tree.
#
# Pushing uses a deploy key (secret SYNC_DEPLOY_KEY) rather than GITHUB_TOKEN, for
# two reasons, both of which are hard blocks rather than preferences:
#   - GITHUB_TOKEN may not create or update files under .github/workflows, and the
#     rebase carries upstream's own changes to its workflows along with it.
#   - Pushes authenticated with GITHUB_TOKEN do not trigger other workflows, so the
#     omll-v* tag would land silently and never start a build.
name: oh-my-llama sync

on:
  schedule:
    # Every 6 hours. Upstream releases every week or two, so this is ample.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to rebase onto, e.g. v0.32.5 (defaults to latest)'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the rebase needs the recorded upstream base commit.
          fetch-depth: 0
          # Check out over SSH with the deploy key so the later push is authorized
          # as a plain user rather than as the Actions app.
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Find the newest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.upstream_tag }}" ]; then
            LATEST="${{ inputs.upstream_tag }}"
          else
            LATEST=$(gh release view --repo ollama/ollama --json tagName --jq .tagName)
          fi
          CURRENT=$(tr -d '[:space:]' < UPSTREAM_VERSION)
          echo "latest=$LATEST"   | tee -a "$GITHUB_OUTPUT"
          echo "current=$CURRENT" | tee -a "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "changed=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "changed=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Rebase our patches onto the new tag
        id: rebase
        if: steps.upstream.outputs.changed == 'true'
        env:
          OLD: ${{ steps.upstream.outputs.current }}
          NEW: ${{ steps.upstream.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name  "oh-my-llama bot"
          git config user.email "noreply@github.com"

          git remote add upstream https://github.com/ollama/ollama.git
          git fetch --no-tags upstream "refs/tags/$OLD:refs/tags/$OLD" "refs/tags/$NEW:refs/tags/$NEW"

          # Our patch commits are everything on this branch that is not in the old
          # upstream tag. --onto replays exactly those onto the new tag.
          echo "Replaying $(git rev-list --count "$OLD"..HEAD) commit(s) onto $NEW"
          git log --oneline "$OLD"..HEAD

          if ! git rebase --onto "$NEW" "$OLD"; then
            # Capture which patch stopped and where before aborting, since the
            # abort throws that away and it is the first thing anyone fixing this
            # by hand needs to know.
            {
              echo "details<<OMLL_DETAILS"
              echo "Stopped replaying: $(git log -1 --format='%h %s' REBASE_HEAD 2>/dev/null || echo 'unknown')"
              echo
              echo 'Conflicted paths:'
              git diff --name-only --diff-filter=U 2>/dev/null || echo '(none reported)'
              echo OMLL_DETAILS
            } >> "$GITHUB_OUTPUT"
            git rebase --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Record the new base so the next run rebases from here.
          echo "$NEW" > UPSTREAM_VERSION
          git commit -am "oh-my-llama: track upstream $NEW"

      - name: Build the fork version string
        id: version
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.upstream.outputs.latest }}
        run: |
          set -euo pipefail
          # <upstream without v>-omll.<n>, n restarting at 1 for each upstream
          # release. semver treats "-omll.N" as a prerelease, which orders both
          # dimensions correctly - see isNewer in app/updater.
          BASE="${NEW#v}"
          N=1
          # --repo is required, not cosmetic: the rebase step adds an "upstream"
          # remote, and gh resolves the base repo from a remote named upstream
          # ahead of origin, so an unqualified call here asks ollama/ollama whether
          # our version exists - always no, which would silently reuse -omll.1.
          while gh release view --repo "$GITHUB_REPOSITORY" "$BASE-omll.$N" >/dev/null 2>&1; do
            N=$((N + 1))
          done
          echo "version=$BASE-omll.$N" | tee -a "$GITHUB_OUTPUT"

      - name: Push the rebased branch and release tag
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The rebase rewrote history, which is expected for this branch.
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
          # Pushing omll-v* is what triggers oh-my-llama-release.yaml.
          git tag "omll-v$VERSION"
          git push origin "omll-v$VERSION"

      # Report any failure, not just a rebase conflict - a failed push or version
      # lookup leaves the fork just as stuck, and silently.
      #
      # The run summary and the error annotation come first because they need no
      # token permissions at all, and they are what the failure email links to.
      # Filing an issue is a best-effort extra on top: it is the part that can be
      # refused, so it must never be the reason a real failure goes unreported,
      # hence no set -e here and the trailing || true.
      - name: Report a failed sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.upstream.outputs.latest }}
          OLD: ${{ steps.upstream.outputs.current }}
          CONFLICT: ${{ steps.rebase.outputs.conflict }}
          DETAILS: ${{ steps.rebase.outputs.details }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          TITLE="oh-my-llama sync onto upstream ${NEW:-unknown} failed"
          if [ "${CONFLICT:-}" = "true" ]; then
            WHAT="Replaying the fork patches from \`${OLD:-?}\` onto \`${NEW:-?}\` hit a conflict, so nothing was pushed."
          else
            WHAT="The sync from \`${OLD:-?}\` to \`${NEW:-?}\` failed before anything was tagged. See the failed step in the run log."
          fi

          # Fenced separately: DETAILS is multi-line, which a ${x:+...} inside the
          # heredoc below would not survive cleanly.
          DETAILS_BLOCK=""
          if [ -n "${DETAILS:-}" ]; then
            DETAILS_BLOCK=$(printf '```\n%s\n```' "$DETAILS")
          fi

          BODY=$(cat <<EOF
          $WHAT

          $DETAILS_BLOCK

          To fix locally:

          \`\`\`sh
          git remote add upstream https://github.com/ollama/ollama.git   # once
          git fetch upstream --tags
          git rebase --onto ${NEW:-NEW} ${OLD:-OLD}
          # resolve, then:
          echo ${NEW:-NEW} > UPSTREAM_VERSION
          git commit -am "oh-my-llama: track upstream ${NEW:-NEW}"
          git push --force-with-lease
          \`\`\`

          Then re-run \`oh-my-llama sync\`, or tag \`omll-v<version>\` by hand to build a release.

          [Failed run]($RUN_URL)
          EOF
          )

          printf '## %s\n\n%s\n' "$TITLE" "$BODY" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=$TITLE::$WHAT See this run's summary for what to do."

          # --repo everywhere below: without it gh targets ollama/ollama, because
          # the rebase step leaves an "upstream" remote behind and gh prefers that
          # name over origin when resolving the base repo. That is what turned this
          # step into "Resource not accessible by integration (createIssue)".
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title 2>/dev/null \
            | jq -r --arg t "$TITLE" '(. // []) | map(select(.title == $t)) | .[0].number // empty' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            # Do not open a fresh issue every six hours for the same stuck rebase.
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing: [run]($RUN_URL)" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body "$BODY" \
              || echo "could not file an issue; the run summary above is the report"
          fi
